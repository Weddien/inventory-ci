name: CI/CD Inventory

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch: 

env:
  APP_PORT: "8105"

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Версия Python и коммит
        run: |
          python --version
          echo "Коммит ${{ github.sha }}"
      - name: Компиляция всех .py и проверка файлов (Вариант 5)
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 python -m py_compile
          test -f Dockerfile
          test -f .dockerignore

  unit_tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Запуск unittest
        run: python -m unittest discover -s tests -v

  package:
    if: (github.ref == 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'rc-'))
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - name: Сборка dist
        run: |
          mkdir -p dist
          cp inventory.py README.md Dockerfile inventory.json.example dist/
          {
            echo "CI_COMMIT_SHA=${{ github.sha }}"
            echo "CI_PIPELINE_ID=${{ github.run_id }}"
            echo "Files:"
            ls -1 dist | grep -v '^manifest.txt$'
          } > dist/manifest.txt
          cat dist/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ github.sha }}
          path: dist/
          retention-days: 7

  package_rc:
    if: startsWith(github.ref, 'refs/tags/rc-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка dist
        run: |
          mkdir -p dist
          cp inventory.py README.md Dockerfile inventory.json.example dist/
          {
            echo "CI_COMMIT_SHA=${{ github.sha }}"
            echo "CI_PIPELINE_ID=${{ github.run_id }}"
            echo "Files:"
            ls -1 dist | grep -v '^manifest.txt$'
          } > dist/manifest.txt
          cat dist/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-${{ github.ref_name }}
          path: dist/
          retention-days: 2

  deploy_test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: test/inventory
      url: http://localhost:8105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inventory-${{ github.sha }}
          path: dist
      - name: Проверка DEPLOY_TOKEN
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN не задан"; exit 1
          fi
          echo "DEPLOY_TOKEN задан (значение скрыто)"
      - name: Копирование и дымовая проверка
        run: |
          mkdir -p deploy/test
          cp -r dist/. deploy/test/
          python scripts/smoke_test.py deploy/test deployment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.sha }}
          path: deployment.txt