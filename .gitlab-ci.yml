stages:
  - validate
  - test
  - package
  - deploy

default:
  image: python:3.12.7-slim

variables:
  APP_PORT: "8105"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

validate:
  stage: validate
  rules: &mr_or_main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - python --version
    - echo "Коммит $CI_COMMIT_SHA"
    - python -m py_compile $(find . -name "*.py" -not -path "./.git/*")
    - echo "Проверка Dockerfile" && test -f Dockerfile
    - echo "Проверка .dockerignore" && test -f .dockerignore

unit_tests:
  stage: test
  rules: *mr_or_main
  script:
    - python -m unittest discover -s tests -v

.package_base:
  stage: package
  script:
    - mkdir -p dist
    - cp inventory.py README.md Dockerfile inventory.json.example dist/
    - |
      {
        echo "CI_COMMIT_SHA=$CI_COMMIT_SHA"
        echo "CI_PIPELINE_ID=$CI_PIPELINE_ID"
        echo "Files:"
        ls -1 dist | grep -v '^manifest.txt$'
      } > dist/manifest.txt
    - cat dist/manifest.txt

package:
  extends: .package_base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^rc-/
  artifacts:
    name: "inventory-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 7 days

package_rc:
  extends: .package_base
  rules:
    - if: $CI_COMMIT_TAG =~ /^rc-/
  artifacts:
    name: "inventory-$CI_COMMIT_TAG"
    paths:
      - dist/
    expire_in: 2 days

deploy_test:
  stage: deploy
  needs:
    - job: package
      artifacts: true
  environment:
    name: test/inventory
    url: http://localhost:$APP_PORT
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - |
      if [ -z "${DEPLOY_TOKEN:-}" ]; then
        echo "DEPLOY_TOKEN не задан"; exit 1
      fi
      echo "DEPLOY_TOKEN задан (значение скрыто)"
    - mkdir -p deploy/test
    - cp -r dist/. deploy/test/
    - python scripts/smoke_test.py deploy/test deployment.txt
  artifacts:
    paths:
      - deployment.txt
    expire_in: 7 days
